    run-weaviate-local-k8s-namespaces:
      needs: get-latest-weaviate-version
      runs-on: ubuntu-latest
      name: Invoke weaviate-local-k8s action with namespaces (two isolated namespaces in one cluster)
      env:
        WORKERS: '3'
        REPLICAS: '3'
        WEAVIATE_VERSION: ${{ needs.get-latest-weaviate-version.outputs.LATEST_WEAVIATE_VERSION }}
        WEAVIATE_LICENSE_KEY: ${{ secrets.WEAVIATE_LICENSE_KEY }}
        WEAVIATE_URL: 'http://127.0.0.1:8080'
        OBJECT_ID: '00000000-0000-0000-0000-000000000001'
      steps:
        - name: Checkout repository
          uses: actions/checkout@v2
        - name: Deploy weaviate-local-k8s from current branch.
          id: invoke-local-k8s
          uses: ./
          with:
            workers: ${{ env.WORKERS }}
            replicas: ${{ env.REPLICAS }}
            weaviate-version: ${{ env.WEAVIATE_VERSION }}
            rbac: 'true'
            dynamic-users: 'true'
            namespaces: 'true'
            namespace-count: '2'
            expose-pods: 'false'
            weaviate-license-key: ${{ env.WEAVIATE_LICENSE_KEY }}
        - name: Check the configured values
          run: |
            set -ex
            replicas=$(kubectl get sts weaviate -n weaviate -o=jsonpath="{.spec.replicas}")
            if [[ "$replicas" -ne ${{ env.REPLICAS }} ]]; then
                echo "Error: Replicas count is not equal to ${{ env.REPLICAS }}. Found $replicas"
                exit 1
            fi
            workers=$(kubectl get nodes --selector=node-role.kubernetes.io/control-plane!= --no-headers | wc -l)
            if [[ "$workers" -ne ${{ env.WORKERS }} ]]; then
                echo "Error: Workers count is not equal to ${{ env.WORKERS }}. Found $workers"
                exit 1
            fi
            versions=$(curl -H "Authorization: Bearer admin-key" -s $WEAVIATE_URL/v1/nodes | jq '.nodes[] | .version' | tr -d '"')
            for version in `echo $versions | tr '\n' ' '`; do
                if [[ "$version" != "${{ env.WEAVIATE_VERSION }}" ]]; then
                    echo "Error: Version is not equal to ${{ env.WEAVIATE_VERSION }}. Found $version"
                    exit 1
                fi
            done
            # NAMESPACES=true must translate into the Weaviate startup invariants.
            for pair in NAMESPACES_ENABLED=true DISABLE_GRAPHQL=true REPLICATION_MAXIMUM_FACTOR=1 NAMESPACE_CLEANUP_INTERVAL=5s; do
                name=${pair%%=*}; want=${pair#*=}
                env_value=$(kubectl get sts weaviate -n weaviate -o=jsonpath="{.spec.template.spec.containers[0].env[?(@.name==\"$name\")].value}")
                if [[ "$env_value" != "$want" ]]; then
                    echo "Error: env.$name is not equal to $want. Found '$env_value'"
                    exit 1
                fi
            done
            # The chart renders authentication.db_users / authorization.rbac into the
            # weaviate-config ConfigMap (conf.yaml), not into the StatefulSet env.
            conf=$(kubectl get configmap weaviate-config -n weaviate -o=jsonpath='{.data.conf\.yaml}')
            for path in .authentication.db_users.enabled .authorization.rbac.enabled; do
                conf_value=$(echo "$conf" | yq -r "$path")
                if [[ "$conf_value" != "true" ]]; then
                    echo "Error: weaviate-config conf.yaml $path is not true. Found '$conf_value'"
                    echo "$conf"
                    exit 1
                fi
            done
            # Verify the enterprise license key reached the pods as LICENSE_KEY.
            # Disable tracing so the key is not echoed, and only check when the
            # secret is available (it is empty for PRs from forks).
            set +x
            if [[ -n "$WEAVIATE_LICENSE_KEY" ]]; then
                env_value=$(kubectl get sts weaviate -n weaviate -o=jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="LICENSE_KEY")].value}')
                if [[ "$env_value" != "$WEAVIATE_LICENSE_KEY" ]]; then
                    echo "Error: env.LICENSE_KEY does not match the WEAVIATE_LICENSE_KEY secret"
                    exit 1
                fi
                echo "env.LICENSE_KEY matches the WEAVIATE_LICENSE_KEY secret"
            else
                echo "WEAVIATE_LICENSE_KEY secret not available, skipping LICENSE_KEY check"
            fi
            set -x
        - name: Namespaces behave like two isolated clusters
          run: |
            set -ex
            ADMIN=(-H "Authorization: Bearer admin-key" -H "Content-Type: application/json")

            # retry_code <want> <label> <curl args...>: poll until the HTTP status matches.
            # Called directly (never inside $(...)) so exit 1 aborts the step.
            retry_code() {
              local want=$1 label=$2; shift 2
              for retry in {1..30}; do
                code=$(curl -s -o /dev/null -w "%{http_code}" "$@")
                if [[ "$code" == "$want" ]]; then
                  echo "$label -> $code"
                  return 0
                fi
                echo "$label returned $code, want $want (retry $retry/30)"
                sleep 2
              done
              echo "ERROR: $label never returned $want"
              exit 1
            }

            # wait_ns_state <ns> <state>: poll GET /v1/namespaces/<ns> until .state matches.
            wait_ns_state() {
              local ns=$1 want=$2
              for retry in {1..30}; do
                state=$(curl -s "${ADMIN[@]}" "$WEAVIATE_URL/v1/namespaces/$ns" | jq -r '.state // empty')
                if [[ "$state" == "$want" ]]; then
                  echo "namespace $ns is $want"
                  return 0
                fi
                echo "namespace $ns state '$state', waiting for '$want' (retry $retry/30)"
                sleep 2
              done
              echo "ERROR: namespace $ns never reached state $want"
              exit 1
            }

            # wait_title <label> <expected title> <auth args...>: poll the object until its title matches.
            # Reads go through the service to any pod, so tolerate schema/replication lag.
            wait_title() {
              local label=$1 want=$2; shift 2
              for retry in {1..30}; do
                title=$(curl -s "$@" "$WEAVIATE_URL/v1/objects/Movies/$OBJECT_ID" | jq -r '.properties.title // empty')
                if [[ "$title" == "$want" ]]; then
                  echo "$label sees title '$title'"
                  return 0
                fi
                echo "$label sees title '$title', want '$want' (retry $retry/30)"
                sleep 2
              done
              echo "ERROR: $label never saw title '$want'"
              exit 1
            }

            # check_placement <qualified class> <home node>: every shard of the class must
            # sit on the home node and nowhere else (mirrors placement_test.go in weaviate).
            check_placement() {
              local class=$1 home=$2
              for retry in {1..30}; do
                nodes=$(curl -s "${ADMIN[@]}" "$WEAVIATE_URL/v1/nodes/$class?output=verbose")
                home_shards=$(jq --arg n "$home" --arg c "$class" '[.nodes[]? | select(.name==$n) | (.shards // [])[] | select(.class==$c)] | length' <<<"$nodes")
                other_shards=$(jq --arg n "$home" --arg c "$class" '[.nodes[]? | select(.name!=$n) | (.shards // [])[] | select(.class==$c)] | length' <<<"$nodes")
                if [[ "$home_shards" == "1" && "$other_shards" == "0" ]]; then
                  echo "$class: 1 shard on $home, 0 elsewhere"
                  return 0
                fi
                echo "$class: $home_shards shard(s) on $home, $other_shards elsewhere (retry $retry/30)"
                sleep 2
              done
              echo "ERROR: $class is not pinned to $home"
              echo "$nodes" | jq '.nodes[]? | {name, shards: [(.shards // [])[] | {class, name}]}'
              exit 1
            }

            # --- 1. namespace-count=2 pre-created ns1 and ns2 on two different home nodes
            wait_ns_state ns1 active
            wait_ns_state ns2 active
            names=$(curl -s "${ADMIN[@]}" "$WEAVIATE_URL/v1/namespaces" | jq -r '.[].name' | sort | tr '\n' ' ')
            if [[ "$names" != "ns1 ns2 " ]]; then
              echo "Error: expected namespaces 'ns1 ns2', found '$names'"
              exit 1
            fi
            for pair in ns1=weaviate-0 ns2=weaviate-1; do
              ns=${pair%%=*}; want=${pair#*=}
              home=$(curl -s "${ADMIN[@]}" "$WEAVIATE_URL/v1/namespaces/$ns" | jq -r '.home_node')
              if [[ "$home" != "$want" ]]; then
                echo "Error: $ns home_node is '$home', expected $want"
                exit 1
              fi
            done

            # --- 2. One pre-created DB user per namespace (keys are never traced) ---
            set +x
            source /tmp/weaviate-namespaces.env
            for var in NS1_API_KEY NS2_API_KEY; do
              if [[ -z "${!var}" ]]; then
                echo "Error: $var missing from /tmp/weaviate-namespaces.env"
                exit 1
              fi
              echo "::add-mask::${!var}"
            done
            U1=(-H "Authorization: Bearer $NS1_API_KEY" -H "Content-Type: application/json")
            U2=(-H "Authorization: Bearer $NS2_API_KEY" -H "Content-Type: application/json")
            set -x
            if [[ "$NS1_USER" != "ns1:admin" || "$NS2_HOME_NODE" != "weaviate-1" ]]; then
              echo "Error: unexpected namespace env file contents: NS1_USER='$NS1_USER' NS2_HOME_NODE='$NS2_HOME_NODE'"
              exit 1
            fi
            retry_code 200 "u1 own-info" "${U1[@]}" "$WEAVIATE_URL/v1/users/own-info"
            retry_code 200 "u2 own-info" "${U2[@]}" "$WEAVIATE_URL/v1/users/own-info"
            # Each user is reported under its short name and holds the admin role.
            u1_info=$(curl -s "${U1[@]}" "$WEAVIATE_URL/v1/users/own-info")
            if [[ "$(jq -r '.username' <<<"$u1_info")" != "admin" ]] || ! jq -e '.roles[] | select(.name=="admin")' <<<"$u1_info" >/dev/null; then
              echo "Error: unexpected own-info for ns1 user: $u1_info"
              exit 1
            fi

            # --- 3. Same short class and same UUID in both namespaces ---------------
            CLASS='{"class":"Movies","properties":[{"name":"title","dataType":["text"]}]}'
            retry_code 200 "u1 create Movies" "${U1[@]}" -X POST "$WEAVIATE_URL/v1/schema" -d "$CLASS"
            retry_code 200 "u2 create Movies" "${U2[@]}" -X POST "$WEAVIATE_URL/v1/schema" -d "$CLASS"
            retry_code 200 "u1 insert" "${U1[@]}" -X POST "$WEAVIATE_URL/v1/objects" -d "{\"class\":\"Movies\",\"id\":\"$OBJECT_ID\",\"properties\":{\"title\":\"ns1-movie\"}}"
            retry_code 200 "u2 insert" "${U2[@]}" -X POST "$WEAVIATE_URL/v1/objects" -d "{\"class\":\"Movies\",\"id\":\"$OBJECT_ID\",\"properties\":{\"title\":\"ns2-movie\"}}"
            wait_title "u1" "ns1-movie" "${U1[@]}"
            wait_title "u2" "ns2-movie" "${U2[@]}"
            # Each user sees only its own short class name.
            u1_classes=$(curl -s "${U1[@]}" "$WEAVIATE_URL/v1/schema" | jq -r '.classes[].class' | tr '\n' ' ')
            if [[ "$u1_classes" != "Movies " ]]; then
              echo "Error: u1 schema should be exactly 'Movies', found '$u1_classes'"
              exit 1
            fi
            # A namespaced user may not address a qualified name, its own or another's.
            retry_code 422 "u1 reading ns2:Movies" "${U1[@]}" "$WEAVIATE_URL/v1/objects/ns2:Movies/$OBJECT_ID"
            retry_code 422 "u1 reading ns1:Movies" "${U1[@]}" "$WEAVIATE_URL/v1/objects/ns1:Movies/$OBJECT_ID"
            # The admin (global operator) sees both, namespace-qualified.
            for retry in {1..30}; do
              admin_classes=$(curl -s "${ADMIN[@]}" "$WEAVIATE_URL/v1/schema" | jq -r '.classes[].class' | sort | tr '\n' ' ')
              [[ "$admin_classes" == "ns1:Movies ns2:Movies " ]] && break
              echo "admin schema is '$admin_classes' (retry $retry/30)"
              sleep 2
              if [[ $retry -eq 30 ]]; then
                echo "Error: admin schema should be exactly 'ns1:Movies ns2:Movies'"
                exit 1
              fi
            done
            admin_title=$(curl -s "${ADMIN[@]}" "$WEAVIATE_URL/v1/objects/ns2:Movies/$OBJECT_ID" | jq -r '.properties.title')
            if [[ "$admin_title" != "ns2-movie" ]]; then
              echo "Error: admin read of ns2:Movies/$OBJECT_ID returned '$admin_title'"
              exit 1
            fi

            # --- 4. Placement: every shard lives on the namespace's home_node -------
            check_placement ns1:Movies weaviate-0
            check_placement ns2:Movies weaviate-1

            # --- 5. Suspend and resume ns1; ns2 is unaffected -----------------------
            retry_code 202 "suspend ns1" "${ADMIN[@]}" -X POST "$WEAVIATE_URL/v1/namespaces/ns1/suspend"
            wait_ns_state ns1 suspended
            retry_code 401 "u1 while suspended" "${U1[@]}" "$WEAVIATE_URL/v1/objects/Movies/$OBJECT_ID"
            wait_title "u2 during ns1 suspension" "ns2-movie" "${U2[@]}"
            retry_code 202 "resume ns1" "${ADMIN[@]}" -X POST "$WEAVIATE_URL/v1/namespaces/ns1/resume"
            wait_ns_state ns1 active
            wait_title "u1 after resume" "ns1-movie" "${U1[@]}"

            # --- 6. Delete ns2; ns1 is unaffected -----------------------------------
            retry_code 202 "delete ns2" "${ADMIN[@]}" -X DELETE "$WEAVIATE_URL/v1/namespaces/ns2"
            # GET keeps answering 200 with state "deleting" until cleanup finishes.
            retry_code 404 "ns2 gone" "${ADMIN[@]}" "$WEAVIATE_URL/v1/namespaces/ns2"
            names=$(curl -s "${ADMIN[@]}" "$WEAVIATE_URL/v1/namespaces" | jq -r '.[].name' | tr '\n' ' ')
            if [[ "$names" != "ns1 " ]]; then
              echo "Error: expected only 'ns1' after delete, found '$names'"
              exit 1
            fi
            for retry in {1..30}; do
              admin_classes=$(curl -s "${ADMIN[@]}" "$WEAVIATE_URL/v1/schema" | jq -r '.classes[].class' | tr '\n' ' ')
              [[ "$admin_classes" == "ns1:Movies " ]] && break
              echo "admin schema is '$admin_classes' (retry $retry/30)"
              sleep 2
              if [[ $retry -eq 30 ]]; then
                echo "Error: admin schema should be exactly 'ns1:Movies' after deleting ns2"
                exit 1
              fi
            done
            # Namespace deletion tears down its users: u2's key is rejected.
            retry_code 401 "u2 after ns2 delete" "${U2[@]}" "$WEAVIATE_URL/v1/users/own-info"
            wait_title "u1 after ns2 delete" "ns1-movie" "${U1[@]}"
            check_placement ns1:Movies weaviate-0
    run-weaviate-local-k8s-expose-pods:
      needs: get-latest-weaviate-version
      runs-on: ubuntu-latest
      name: Test pod restart with exposed ports
      env:
        WORKERS: '1'
        REPLICAS: '3'
        WEAVIATE_VERSION: ${{ needs.get-latest-weaviate-version.outputs.LATEST_WEAVIATE_VERSION }}
        EXPOSE_PODS: 'true'
      steps:
        - name: Checkout repository
          uses: actions/checkout@v2
        - name: Deploy weaviate-local-k8s with exposed pods
          id: invoke-local-k8s
          uses: ./
          with:
            workers: ${{ env.WORKERS }}
            replicas: ${{ env.REPLICAS }}
            weaviate-version: ${{ env.WEAVIATE_VERSION }}
            expose-pods: ${{ env.EXPOSE_PODS }}
        - name: Verify initial port exposure
          run: |
            set -ex
            # Check all pods are listening with retries
            for i in {0..2}; do
              PORT=$((8080 + i + 1))
              GRPC_PORT=$((50051 + i + 1))
              METRICS_PORT=$((2112 + i + 1))
              PROFILER_PORT=$((6060 + i + 1))

              # Verify HTTP port with retries
              for retry in {1..30}; do
                if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$PORT/v1/nodes | grep -q 200; then
                  break
                fi
                echo "HTTP port $PORT not ready, retry $retry/30"
                sleep 2
                if [[ $retry -eq 30 ]]; then
                  echo "ERROR: HTTP port $PORT not ready after 30 retries"
                  exit 1
                fi
              done
              curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$PORT/v1/nodes | grep -q 200 || {
                echo "ERROR: HTTP port $PORT final check failed"
                exit 1
              }

              # Verify gRPC port with retries and timeout
              for retry in {1..30}; do
                if nc -z -w 1 127.0.0.1 $GRPC_PORT; then
                  break
                fi
                echo "gRPC port $GRPC_PORT not ready, retry $retry/30"
                sleep 2
                if [[ $retry -eq 30 ]]; then
                  echo "ERROR: gRPC port $GRPC_PORT not ready after 30 retries"
                  exit 1
                fi
              done
              nc -z -w 5 127.0.0.1 $GRPC_PORT || {
                echo "ERROR: gRPC port $GRPC_PORT final check failed"
                exit 1
              }

              # Verify metrics port with retries
              for retry in {1..30}; do
                if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$METRICS_PORT/metrics | grep -q 200; then
                  break
                fi
                echo "Metrics port $METRICS_PORT not ready, retry $retry/30"
                sleep 2
                if [[ $retry -eq 30 ]]; then
                  echo "ERROR: Metrics port $METRICS_PORT not ready after 30 retries"
                  exit 1
                fi
              done
              curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$METRICS_PORT/metrics | grep -q 200 || {
                echo "ERROR: Metrics port $METRICS_PORT final check failed"
                exit 1
              }

              # Verify profiler port with retries. Require HTTP 200 from the
              # pprof index: the port is open even when debug endpoints are
              # gated off (404), so a plain connectivity check would not catch
              # a missing DEBUG_ENDPOINTS_ENABLED env var.
              for retry in {1..30}; do
                if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$PROFILER_PORT/debug/pprof/ | grep -q 200; then
                  break
                fi
                echo "Profiler port $PROFILER_PORT not ready, retry $retry/30"
                sleep 2
                if [[ $retry -eq 30 ]]; then
                  echo "ERROR: Profiler port $PROFILER_PORT not ready after 30 retries"
                  exit 1
                fi
              done
              curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$PROFILER_PORT/debug/pprof/ | grep -q 200 || {
                echo "ERROR: Profiler port $PROFILER_PORT final check failed (pprof index not returning 200)"
                exit 1
              }
            done
        - name: Restart pod and verify reconnection
          run: |
            set -ex
            # Force delete pod weaviate-2
            kubectl delete pod weaviate-2 -n weaviate --force --grace-period=0

            # Wait for pod to be recreated
            kubectl wait --for=condition=ready pod/weaviate-2 -n weaviate --timeout=3m

            echo "Wait for Weaviate to be ready"
            for timer in {1..120}; do
              if curl -sf -o /dev/null localhost:8080/v1/.well-known/ready; then
                echo "Weaviate is ready"
                break
              fi

              if [ "$timer" -eq 120 ]; then
                echo "ERROR: Weaviate is not ready after 120s"
                exit 1
              fi

              echo "Weaviate is not ready, trying again in 1s"
              sleep 1
            done

            # Verify specific port for weaviate-2 (8080 + 2 + 1 = 8083)
            echo "Checking nodes API on port 8083"

            # Add retries for port forwarding to stabilize
            for retry in {1..30}; do
              HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" --retry 5 --retry-delay 5 --max-time 10 http://127.0.0.1:8083/v1/nodes || echo "000")

              if [[ "$HTTP_CODE" == "200" ]]; then
                echo "Successfully connected to port 8083"
                break
              fi

              echo "Port 8083 not ready (HTTP_CODE=$HTTP_CODE), retry $retry/30"
              sleep 5

              # Check if port forwarding is active
              if ! lsof -i :8083 | grep -q kubectl-r; then
                echo "Port forwarding not active, attempting to restart..."
                sleep 5
              fi

              if [[ $retry -eq 30 ]]; then
                echo "ERROR: Port 8083 not ready after all retries"
                echo "Port forwarding status:"
                lsof -i :8083 || true
                echo "Pod status:"
                kubectl get pod weaviate-2 -n weaviate -o yaml
                echo "Service status:"
                kubectl get svc weaviate-2 -n weaviate -o yaml
                cat response.json || true
                rm -f response.json
                exit 1
              fi
            done

            NODE_COUNT=$(jq '.nodes | length' response.json)
            if [[ "$NODE_COUNT" -ne 3 ]]; then
              echo "ERROR: Expected 3 nodes, but found $NODE_COUNT"
              echo "Nodes list:"
              jq '.nodes' response.json
              rm response.json
              exit 1
            fi

            echo "Port 8083 verification successful"
            rm -f response.json
    run-weaviate-local-k8s-oidc:
      needs: get-latest-weaviate-version
      runs-on: ubuntu-latest
      name: Invoke weaviate-local-k8s action with OIDC support
      env:
        WORKERS: '1'
        REPLICAS: '3'
        WEAVIATE_VERSION: ${{ needs.get-latest-weaviate-version.outputs.LATEST_WEAVIATE_VERSION }}
      steps:
        - name: Checkout repository
          uses: actions/checkout@v2
        - name: Deploy weaviate-local-k8s from current branch.
          id: invoke-local-k8s
          uses: ./
          with:
            workers: ${{ env.WORKERS }}
            replicas: ${{ env.REPLICAS }}
            weaviate-version: ${{ env.WEAVIATE_VERSION }}
            oidc: 'true'
        - name: Check the configured values
          run: |
            set -x
            replicas=$(kubectl get sts weaviate -n weaviate -o=jsonpath="{.spec.replicas}")
            if [[ "$replicas" -ne ${{ env.REPLICAS }} ]]; then
                echo "Error: Replicas count is not equal to ${{ env.REPLICAS }}. Found $replicas"
                exit 1
            fi
            workers=$(kubectl get nodes --selector=node-role.kubernetes.io/control-plane!= --no-headers | wc -l)
            if [[ "$workers" -ne ${{ env.WORKERS }} ]]; then
                echo "Error: Workers count is not equal to ${{ env.WORKERS }}. Found $workers"
                exit 1
            fi
            versions=$(curl -H -s  http://127.0.0.1:8080/v1/nodes | jq '.nodes[] | .version' | tr -d '"')
            for version in `echo $versions | tr '\n' ' '`; do
                if [[ "$version" != "${{ env.WEAVIATE_VERSION }}" ]]; then
                    echo "Error: Version is not equal to ${{ env.WEAVIATE_VERSION }}. Found $version"
                    exit 1
                fi
            done
            sleep 2 # Wait for the metrics to be available
            error=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:2112/metrics)
            if [[ "$error" -ne 200 ]]; then
              echo "Error: Weaviate metrics is not listening, returned $error"
              exit 1
            fi
            if ! grep -q "keycloak.oidc.svc.cluster.local" /etc/hosts; then
                echo "Error: 127.0.0.1 keycloak.oidc.svc.cluster.local is not in /etc/hosts"
                exit 1
            fi
            # Check that it is possible to authenticate with the keycloak
            auth_info=$(curl --fail -s -X POST -d grant_type=password -d client_id=admin-cli -d username=admin -d password=admin http://keycloak.oidc.svc.cluster.local:9090/realms/master/protocol/openid-connect/token)
            if [[ $? -ne 0 ]]; then
                echo "Error: Failed to authenticate with the keycloak"
                exit 1
            fi
            TOKEN=$( echo "$auth_info" | jq -r .access_token )
            # Check that it possible to create a user
            curl -s -X POST -d '{"username":"test-user", "enabled":true, "email":"test-user@example.com", "emailVerified":true, "credentials":[{"type":"password","value":"test-password"}]}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            http://keycloak.oidc.svc.cluster.local:9090/admin/realms/weaviate/users
            if [[ $? -ne 0 ]]; then
                echo "Error: Failed to create a user"
                exit 1
            fi
    run-weaviate-local-k8s-port-in-use:
      needs: get-latest-weaviate-version
      runs-on: ubuntu-latest
      name: Verify port availability check fails when port 8080 is in use
      env:
        WORKERS: '1'
        REPLICAS: '1'
        WEAVIATE_VERSION: ${{ needs.get-latest-weaviate-version.outputs.LATEST_WEAVIATE_VERSION }}
      steps:
        - name: Checkout repository
          uses: actions/checkout@v2
        - name: Start a process to occupy port 8080
          run: |
            # Start a simple HTTP server on port 8080
            python3 -m http.server 8080 &
            SERVER_PID=$!
            # Wait a moment to ensure the server is running
            sleep 2
            # Verify the port is in use
            if ! lsof -i :8080 | grep -q LISTEN; then
              echo "Failed to start server on port 8080"
              exit 1
            fi
            # Store the PID for cleanup
            echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
        - name: Attempt to deploy weaviate-local-k8s (should fail)
          id: invoke-local-k8s
          uses: ./
          with:
            workers: ${{ env.WORKERS }}
            replicas: ${{ env.REPLICAS }}
            weaviate-version: ${{ env.WEAVIATE_VERSION }}
            expose-pods: 'false'
          continue-on-error: true
        - name: Verify deployment failed due to port in use
          if: steps.invoke-local-k8s.outcome == 'success'
          run: |
            echo "The deployment should have failed due to port 8080 being in use, but it succeeded"
            exit 1
    run-weaviate-local-k8s-substring-port:
      needs: get-latest-weaviate-version
      runs-on: ubuntu-latest
      name: Verify substring-superset ports do not block setup or forwarding
      env:
        WORKERS: '1'
        REPLICAS: '2'
        WEAVIATE_VERSION: ${{ needs.get-latest-weaviate-version.outputs.LATEST_WEAVIATE_VERSION }}
        EXPOSE_PODS: 'true'
      steps:
        - name: Checkout repository
          uses: actions/checkout@v2
        - name: Occupy ports that contain Weaviate ports as substrings
          run: |
            # A buggy unanchored match (grep ":2114") treats a Weaviate port as
            # taken whenever a listener's port string starts with it, e.g. :21146
            # begins with :2114. Occupy several such superset ports. Only the
            # metrics (211xx) and profiler (606xx) families are collidable: an
            # HTTP (8080x) or gRPC (50051x) superset would exceed the 65535 max.
            #   21146 -> 2114 (weaviate-1 metrics: per-pod loop check + forward)
            #   60616 -> 6061 (weaviate-0 profiler: per-pod loop check + forward)
            #   21126 -> 2112 (default metrics: pre-flight default-port check)
            # That an exact listener *does* block setup is covered separately by
            # run-weaviate-local-k8s-port-in-use.
            PIDS=""
            for p in 21146 60616 21126; do
              python3 -m http.server "$p" --bind 127.0.0.1 &
              PIDS="$PIDS $!"
            done
            sleep 2
            for p in 21146 60616 21126; do
              if ! lsof -i :"$p" | grep -q LISTEN; then
                echo "Failed to occupy port $p"
                exit 1
              fi
            done
            echo "SQUAT_PIDS=$PIDS" >> $GITHUB_ENV
        - name: Deploy weaviate-local-k8s (must succeed despite the listeners)
          id: invoke-local-k8s
          uses: ./
          with:
            workers: ${{ env.WORKERS }}
            replicas: ${{ env.REPLICAS }}
            weaviate-version: ${{ env.WEAVIATE_VERSION }}
            expose-pods: ${{ env.EXPOSE_PODS }}
        - name: Verify the cluster came up and substring ports were forwarded
          run: |
            set -ex
            # Setup succeeding at all proves the pre-flight check did not falsely
            # flag 2112/2114/6061 because of the :21126/:21146/:60616 listeners.
            for retry in {1..30}; do
              if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/v1/nodes | grep -q 200; then
                break
              fi
              echo "Weaviate not ready, retry $retry/30"
              sleep 2
              if [[ $retry -eq 30 ]]; then
                echo "ERROR: cluster did not come up"
                exit 1
              fi
            done
            NODE_COUNT=$(curl -s http://127.0.0.1:8080/v1/nodes | jq '.nodes | length')
            if [[ "$NODE_COUNT" -ne 2 ]]; then
              echo "ERROR: expected 2 nodes, found $NODE_COUNT"
              exit 1
            fi

            # weaviate-1 metrics (:2114) must be forwarded, not skipped due to
            # the :21146 listener.
            for retry in {1..30}; do
              if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:2114/metrics | grep -q 200; then
                echo "Metrics port 2114 is forwarded and reachable"
                break
              fi
              echo "Metrics port 2114 not ready, retry $retry/30"
              sleep 2
              if [[ $retry -eq 30 ]]; then
                echo "ERROR: Metrics port 2114 not forwarded (substring match regression?)"
                lsof -i -n -P | grep LISTEN | grep kubectl-r || true
                exit 1
              fi
            done
            # The listener on :2114 must be kubectl-relay, not a squatter.
            if ! lsof -i -n -P | grep LISTEN | grep kubectl-r | grep -qE ":2114([^0-9]|$)"; then
              echo "ERROR: No kubectl-relay listener on exactly :2114"
              lsof -i -n -P | grep LISTEN | grep kubectl-r || true
              exit 1
            fi

            # weaviate-0 profiler (:6061) must be forwarded, not skipped due to
            # the :60616 listener.
            if ! nc -z -w 5 127.0.0.1 6061; then
              echo "ERROR: profiler port 6061 not forwarded"
              lsof -i -n -P | grep LISTEN | grep kubectl-r || true
              exit 1
            fi
        - name: Stop the port-occupying servers
          if: always()
          run: |
            for pid in ${SQUAT_PIDS:-}; do
              kill "$pid" || true
            done

